services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  frontend:
    ports:
      - "127.0.0.1:8080:80"

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - backend
    profiles: ["dev"]

volumes:
  frontend-node-modules:
